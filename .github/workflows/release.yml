# Builds Zap MCP for macOS (arm64), Windows (x64) and Linux (x64), smoke-tests each packaged app
# on its own OS, and attaches the installers plus the Claude Desktop extension to the GitHub release.
# Runs when a v* tag is pushed, or by hand for an existing tag.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.2.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # No signing certificates yet: macOS gets an ad-hoc signature, Windows is unsigned.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if missing
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --prerelease --verify-tag \
            --title "Zap MCP $TAG (alpha)" --notes "Builds for macOS, Windows and Linux are being attached by CI."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS arm64
          - os: windows-2022
            name: Windows x64
          - os: ubuntu-22.04
            name: Linux x64
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build app and Claude Desktop extension
        run: npm run build && npm run pack:mcpb

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          codesign --force --deep --sign - "dist/mac-arm64/Zap MCP.app"
          codesign --verify --deep --strict "dist/mac-arm64/Zap MCP.app"
          npx electron-builder --mac dmg zip --arm64 --publish never --prepackaged "dist/mac-arm64/Zap MCP.app"
          echo "APP_EXE=dist/mac-arm64/Zap MCP.app/Contents/MacOS/Zap MCP" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          npx electron-builder --win nsis zip --x64 --publish never
          echo "APP_EXE=dist/win-unpacked/Zap MCP.exe" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          npx electron-builder --linux AppImage deb --x64 --publish never
          echo "APP_EXE=dist/linux-unpacked/zap-mcp" >> "$GITHUB_ENV"

      - name: Smoke test the packaged app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Headless display; the unpacked dir has no setuid sandbox helper (the .deb sets it up).
            xvfb-run -a node scripts/smoke-test.mjs "$APP_EXE" --no-sandbox
          else
            node scripts/smoke-test.mjs "$APP_EXE"
          fi

      - name: Upload to the release
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb)
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp zap-mcp.mcpb "dist/zap-mcp-${TAG#v}.mcpb"
            files+=("dist/zap-mcp-${TAG#v}.mcpb")
          fi
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
